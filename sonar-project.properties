sonar.projectKey=oficina-mecanica-monolith
sonar.projectName=Oficina Mecanica - Monolito
sonar.projectVersion=3.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=cmd,database,internal,packages
sonar.tests=cmd,database,internal,packages
sonar.test.inclusions=**/*_test.go

# Fora da analise: apenas artefatos que nao sao codigo-fonte deste repo.
# `web/**` saiu junto com o painel para o oficina-mecanica-frontend.
sonar.exclusions=**/*_test.go,.git/**,.scannerwork/**,.vscode/**,.github/**

# Fora da METRICA de cobertura -- continuam analisados para bugs e code smells.
#   cmd/**                  wiring de processo, sem logica
#   database/**             migrations SQL e go:embed
#   internal/config/**      leitura de env
#   internal/repository/**  adaptadores SQL; so exercitados nos testes de
#                           integracao, que exigem Postgres
sonar.coverage.exclusions=cmd/**,database/**,internal/config/**,internal/repository/**,**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
